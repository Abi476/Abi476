<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .txt-small { font: 700 22px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: 4px; }
      .txt-big { font: 800 46px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1000" height="260" rx="10" fill="#16232e"/>

  <!-- scattered shapes -->
  <!-- stars -->
  <g fill="#f6c945">
    <path transform="translate(90,55) scale(1.1)" d="M10 0 L13 7 L20 8 L14.5 13 L16 20 L10 16 L4 20 L5.5 13 L0 8 L7 7 Z"/>
    <path transform="translate(760,40) scale(1.3)" d="M10 0 L13 7 L20 8 L14.5 13 L16 20 L10 16 L4 20 L5.5 13 L0 8 L7 7 Z"/>
    <path transform="translate(880,150) scale(1.1)" d="M10 0 L13 7 L20 8 L14.5 13 L16 20 L10 16 L4 20 L5.5 13 L0 8 L7 7 Z"/>
    <path transform="translate(150,205) scale(0.9)" d="M10 0 L13 7 L20 8 L14.5 13 L16 20 L10 16 L4 20 L5.5 13 L0 8 L7 7 Z"/>
    <path transform="translate(660,205) scale(1)" d="M10 0 L13 7 L20 8 L14.5 13 L16 20 L10 16 L4 20 L5.5 13 L0 8 L7 7 Z"/>
  </g>

  <!-- filled circles (pink/magenta) -->
  <circle cx="905" cy="70" r="26" fill="#e857a6"/>
  <circle cx="60" cy="150" r="14" fill="#e857a6"/>
  <circle cx="500" cy="30" r="9" fill="#e857a6"/>

  <!-- outlined circles (blue) -->
  <circle cx="130" cy="110" r="16" fill="none" stroke="#5aa9e6" stroke-width="3"/>
  <circle cx="830" cy="115" r="20" fill="none" stroke="#5aa9e6" stroke-width="3"/>
  <circle cx="620" cy="60" r="11" fill="none" stroke="#5aa9e6" stroke-width="3"/>
  <circle cx="360" cy="215" r="13" fill="none" stroke="#5aa9e6" stroke-width="3"/>

  <!-- purple hexagon outlines -->
  <polygon points="960,190 972,197 972,211 960,218 948,211 948,197" fill="none" stroke="#a67cf0" stroke-width="3"/>
  <polygon points="40,50 52,57 52,71 40,78 28,71 28,57" fill="none" stroke="#a67cf0" stroke-width="3"/>

  <!-- rotated squares (yellow) -->
  <rect x="0" y="0" width="20" height="20" fill="#f6c945" transform="translate(255,45) rotate(20)"/>
  <rect x="0" y="0" width="16" height="16" fill="#f6c945" transform="translate(720,175) rotate(15)"/>
  <rect x="0" y="0" width="14" height="14" fill="none" stroke="#f6c945" stroke-width="3" transform="translate(935,40) rotate(30)"/>

  <!-- teal diamond outlines -->
  <polygon points="0,-11 11,0 0,11 -11,0" fill="none" stroke="#3fc1c9" stroke-width="3" transform="translate(210,175)"/>
  <polygon points="0,-9 9,0 0,9 -9,0" fill="none" stroke="#3fc1c9" stroke-width="3" transform="translate(780,105)"/>

  <!-- small dots -->
  <circle cx="300" cy="90" r="4" fill="#ffffff" opacity="0.5"/>
  <circle cx="440" cy="200" r="4" fill="#ffffff" opacity="0.5"/>
  <circle cx="600" cy="150" r="4" fill="#ffffff" opacity="0.5"/>
  <circle cx="100" cy="200" r="4" fill="#ffffff" opacity="0.5"/>
  <circle cx="870" cy="200" r="4" fill="#ffffff" opacity="0.5"/>

  <!-- text -->
  <text x="500" y="112" text-anchor="middle" class="txt-small">HI, I'M</text>
  <text x="500" y="160" text-anchor="middle" class="txt-big">ABI BAYU RAFSANZHANY</text>
</svg>
